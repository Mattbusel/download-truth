[package]
name = "download-truth"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Download counts mostly measure CI and publishing, not users. Splits a crates.io or npm package's downloads into lockfile replays, pinned old lines nobody publishes against, release-time fetches, flat automation and the human-rhythm rest, and fails a README downloads badge when most of it is noise."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Mattbusel/download-truth"
homepage = "https://github.com/Mattbusel/download-truth"
readme = "README.md"
keywords = ["downloads", "crates-io", "npm", "metrics", "ci"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/results", "/.github"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
lto = "thin"
